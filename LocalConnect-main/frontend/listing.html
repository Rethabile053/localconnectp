<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listing Details - LocalConnect</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="auth-styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js/dist/umd/supabase.min.js"></script>
  <script src="supabase.js"></script>
  <script src="auth-guard.js"></script>
  <script src="listings.js"></script>
  <style>
    .listing-details-container {
      max-width: 1000px;
      margin: 2rem auto;
      padding: 0 1rem;
      display: grid;
      grid-template-columns: 1fr 350px;
      gap: 2rem;
    }
    
    @media (max-width: 768px) {
      .listing-details-container {
        grid-template-columns: 1fr;
      }
    }

    .main-image-container {
      border-radius: 12px;
      overflow: hidden;
      background: var(--gray-100);
      aspect-ratio: 4/3;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
    }

    .main-image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .image-thumbnails {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
    }

    .thumbnail {
      width: 80px;
      height: 80px;
      border-radius: 8px;
      object-fit: cover;
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 0.2s;
    }

    .thumbnail:hover, .thumbnail.active {
      opacity: 1;
      border: 2px solid var(--primary-color);
    }

    .details-card {
      background: white;
      border: 1px solid var(--gray-200);
      border-radius: 12px;
      padding: 1.5rem;
      position: sticky;
      top: 1rem;
    }

    .details-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--gray-900);
      margin-bottom: 0.5rem;
    }

    .details-price {
      font-size: 2rem;
      font-weight: 700;
      color: var(--gray-900);
      margin-bottom: 1rem;
    }

    .details-meta-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--gray-600);
      margin-bottom: 0.5rem;
    }

    .details-actions {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }

    .seller-profile-card {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--gray-200);
    }

    .seller-avatar-large {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--primary-color);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 1.2rem;
    }

    .description-section {
      margin-top: 2rem;
      line-height: 1.6;
      color: var(--gray-700);
    }

    .loading-state {
      text-align: center;
      padding: 4rem;
      color: var(--gray-600);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="header-container">
      <div>
        <a href="index.html" style="text-decoration: none; color: inherit;">
          <div class="logo">LocalConnect</div>
          <div class="tagline">Your Neighborhood Marketplace</div>
        </a>
      </div>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="browse.html">Browse</a>
        <a href="post.html">Post Item</a>
        <a href="messages.html">Messages</a>
        <a href="profile.html">My Profile</a>
        <a href="cart.html">Cart</a>
      </nav>
    </div>
  </header>

  <main class="main-container" id="listingContent">
    <div class="loading-state">
      <h2>Loading listing details...</h2>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const listingId = urlParams.get('id');
      const container = document.getElementById('listingContent');

      if (!listingId) {
        container.innerHTML = '<div class="loading-state"><h2>Listing not found</h2><p><a href="browse.html">Back to browse</a></p></div>';
        return;
      }

      try {
        const listing = await getListing(listingId);
        
        if (!listing) {
          container.innerHTML = '<div class="loading-state"><h2>Listing not found or has been removed</h2><p><a href="browse.html">Back to browse</a></p></div>';
          return;
        }

        const date = new Date(listing.created_at).toLocaleDateString(undefined, {
          year: 'numeric',
          month: 'long',
          day: 'numeric'
        });

        const sellerName = listing.user_profiles?.display_name || 'Seller';
        const sellerInitials = sellerName.slice(0, 2).toUpperCase();

        const hasImages = listing.image_urls && listing.image_urls.length > 0;
        const mainImage = hasImages ? listing.image_urls[0] : '';
        const imageHtml = hasImages ? `
          <img src="${mainImage}" alt="${listing.title}" id="mainImage">
        ` : `<div style="font-size: 4rem;">${getCategoryIcon(listing.category)}</div>`;

        const thumbnailsHtml = hasImages && listing.image_urls.length > 1 ? `
          <div class="image-thumbnails">
            ${listing.image_urls.map((url, i) => `
              <img src="${url}" class="thumbnail ${i === 0 ? 'active' : ''}" onclick="document.getElementById('mainImage').src='${url}'; document.querySelectorAll('.thumbnail').forEach(t => t.classList.remove('active')); this.classList.add('active');" alt="Thumbnail">
            `).join('')}
          </div>
        ` : '';

        container.innerHTML = `
          <div class="listing-details-container">
            <div class="listing-images-section">
              <div class="main-image-container">
                ${imageHtml}
              </div>
              ${thumbnailsHtml}
              
              <div class="description-section">
                <h3 style="margin-bottom: 1rem; font-size: 1.25rem;">Description</h3>
                <div style="white-space: pre-wrap;">${listing.description || 'No description provided.'}</div>
              </div>
            </div>

            <div class="listing-info-section">
              <div class="details-card">
                <div style="color: var(--gray-500); font-size: 0.875rem; margin-bottom: 0.5rem; text-transform: capitalize;">
                  ${listing.category}
                </div>
                <h1 class="details-title">${listing.title}</h1>
                <div class="details-price">${formatPrice(listing.price)}</div>
                
                <div class="details-meta-item">
                  <span>📍</span> ${listing.location}
                </div>
                <div class="details-meta-item">
                  <span>🗓️</span> Posted ${date}
                </div>
                <div class="details-meta-item">
                  <span>✨</span> Condition: <span style="text-transform: capitalize;">${listing.condition || 'Not specified'}</span>
                </div>

                <div class="details-actions">
                  <button class="btn btn-primary" onclick="window.location.href='messages.html?to=${listing.user_id}&listing=${listing.id}'">
                    Message Seller
                  </button>
                  <button class="btn btn-secondary" onclick="handleAddToCart('${listing.id}')" id="addToCartBtn">
                    Add to Cart
                  </button>
                  <button class="btn btn-secondary" onclick="handleToggleFavorite('${listing.id}')" id="favBtn">
                    Add to Favorites
                  </button>
                </div>

                <div class="seller-profile-card">
                  <div class="seller-avatar-large">${sellerInitials}</div>
                  <div>
                    <div style="font-weight: 600;">${sellerName}</div>
                    <div style="font-size: 0.875rem; color: var(--gray-600);">Member</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
      } catch (err) {
        console.error('Error loading listing:', err);
        container.innerHTML = '<div class="loading-state"><h2>Error loading listing</h2><p>Please try again later.</p></div>';
      }
    });

    async function handleAddToCart(id) {
        try {
            await addToCart(id, 1);
            alert("Added to cart successfully!");
        } catch(error) {
            alert("Could not add to cart. Are you logged in?");
        }
    }

    async function handleToggleFavorite(id) {
        try {
            await addToFavorites(id);
            alert("Added to favorites successfully!");
        } catch(error) {
            alert("Could not add to favorites. Are you logged in or is it already added?");
        }
    }
  </script>
</body>
</html>
