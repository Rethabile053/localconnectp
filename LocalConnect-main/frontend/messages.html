<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages - LocalConnect</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js/dist/umd/supabase.min.js"></script>
  <script src="supabase.js"></script>
  <script src="auth-guard.js"></script>
<base target="_blank">
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="header-container">
      <div>
        <a href="index.html" class="logo" style="text-decoration: none;">LocalConnect</a>
        <div class="tagline">Your Neighborhood Marketplace</div>
      </div>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="browse.html">Browse</a>
        <a href="post.html">Post Item</a>
        <a href="messages.html" class="active">Messages</a>
        <a href="profile.html">My Profile</a>
      </nav>
      <div class="user-actions">
        <a href="login.html" class="btn btn-secondary btn-sm">Log In</a>
        <a href="register.html" class="btn btn-primary btn-sm">Sign Up</a>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-container" style="padding-top: 2rem;">
    <div class="chat-layout">

  <!-- Conversations List -->
      
<div class="conversations-list">

    <div class="conversations-header">
        Users
    </div>

    <div id="usersList"></div>

</div>
      <!-- Chat Area -->
<div class="chat-area">

    <div class="chat-header">

        <div id="chatUserName">
            Select a user
        </div>

    </div>

    <div class="chat-messages" id="chat-box">

    </div>

    <div class="chat-input-area">

        <input
            type="text"
            id="messageInput"
            class="chat-input"
            placeholder="Type a message..."
        >

        <button
            id="sendBtn"
            class="send-btn">
            ➤
        </button>

    </div>

</div>

  </main>

  <!-- Footer -->
  <footer class="site-footer" style="margin-top: 2rem;">
    <div class="footer-container">
      <div class="footer-bottom" style="border-top: none; padding-top: 0;">
        <p class="footer-copyright">© 2026 LocalConnect Marketplace. All rights reserved.</p>
        <div class="footer-legal">
          <a href="about.html">About</a>
          <a href="help.html">Help Center</a>
          <a href="safety.html">Safety</a>
          <a href="terms.html">Terms of Service</a>
          <a href="privacy.html">Privacy Policy</a>
          <a href="contact.html">Contact Us</a>
        </div>
      </div>
    </div>
  </footer>
<script>
const supabase1 = supabaseClient;

let currentRecipientId = null;
let currentListingId = null;
let currentUser1 = null;
let channels = null;

async function init() {
    const {
        data: { user }
    } = await supabase1.auth.getUser();

    if (!user) {
        window.location.href = 'login.html';
        return;
    }
    
    currentUser1 = user;

    // Check URL parameters for starting a conversation
    const urlParams = new URLSearchParams(window.location.search);
    const to = urlParams.get('to');
    const listingId = urlParams.get('listing');

    if (to) {
        currentRecipientId = to;
    }
    if (listingId) {
        currentListingId = listingId;
    }

    await loadConversations();

    if (currentRecipientId) {
        await openChat(currentRecipientId);
    }
}

async function loadConversations() {
    const { data: profiles, error: profilesError } = await supabase1
        .from('user_profiles')
        .select('*');

    if (profilesError) {
        console.error(profilesError);
        return;
    }

    const otherProfiles = profiles.filter(p => p.id !== currentUser1.id);

    const usersList = document.getElementById("usersList");
    usersList.innerHTML = "";

    if (otherProfiles.length === 0) {
        usersList.innerHTML = `<div style="padding: 1rem; color: #666; font-size: 0.875rem;">No other users found.</div>`;
        return;
    }

    otherProfiles.forEach(profile => {
        usersList.innerHTML += `
            <div
                class="conversation-item"
                style="padding: 1rem; border-bottom: 1px solid #eee; cursor: pointer; display: flex; align-items: center; gap: 0.75rem;"
                onclick="openChat('${profile.id}', '${profile.display_name?.replace(/'/g, "\\'") || 'User'}')"
                id="conv-${profile.id}"
            >
                <div style="width: 40px; height: 40px; border-radius: 50%; background: var(--primary-color, #0f766e); color: white; display: flex; align-items: center; justify-content: center; font-weight: 600;">
                    ${(profile.display_name || 'U').slice(0, 2).toUpperCase()}
                </div>
                <div class="conversation-info" style="flex: 1;">
                    <div class="conversation-name" style="font-weight: 600;">
                        ${profile.display_name || 'Unknown User'}
                    </div>
                </div>
            </div>
        `;
    });
}

function updateActiveConversationStyle() {
    document.querySelectorAll('.conversation-item').forEach(el => {
        el.style.backgroundColor = 'transparent';
    });
    if (currentRecipientId) {
        const activeItem = document.getElementById(`conv-${currentRecipientId}`);
        if (activeItem) {
            activeItem.style.backgroundColor = '#f1f5f9';
        }
    }
}

async function openChat(id, name = null) {
    currentRecipientId = id;
    
    // If name is not provided, fetch it
    if (!name) {
        const { data } = await supabase1.from('user_profiles').select('display_name').eq('id', id).single();
        if (data) {
            name = data.display_name;
        } else {
            name = 'User';
        }
    }

    document.getElementById("chatUserName").innerHTML = `<div style="display: flex; align-items: center; gap: 0.75rem;">
        <div style="width: 32px; height: 32px; border-radius: 50%; background: #e2e8f0; color: #475569; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 0.875rem;">
            ${(name || 'U').slice(0, 2).toUpperCase()}
        </div>
        <div style="font-weight: 600;">${name}</div>
    </div>`;

    updateActiveConversationStyle();
    await loadMessages();
    subscribeToMessages();
}

async function loadMessages() {
    if (!currentRecipientId) return;

    const { data, error } = await supabase1
        .from("messages")
        .select("*")
        .or(`and(sender_id.eq.${currentUser1.id},recipient_id.eq.${currentRecipientId}),and(sender_id.eq.${currentRecipientId},recipient_id.eq.${currentUser1.id})`)
        .order("created_at");

    if (error) {
        console.error(error);
        return;
    }

    const chatBox = document.getElementById("chat-box");
    chatBox.innerHTML = "";
    
    // Add simple inline styles for message bubbles if not already present in css
    const commonBubbleStyle = "padding: 0.75rem 1rem; border-radius: 12px; max-width: 70%; word-break: break-word;";
    const sentStyle = `background: var(--primary-color, #0f766e); color: white; border-bottom-right-radius: 4px;`;
    const receivedStyle = `background: #f1f5f9; color: #1e293b; border-bottom-left-radius: 4px;`;

    if (data.length === 0) {
        chatBox.innerHTML = `<div style="text-align: center; color: #64748b; margin-top: 2rem;">No messages yet. Send a message to start the conversation!</div>`;
        return;
    }

    data.forEach(msg => {
        const mine = msg.sender_id === currentUser1.id;
        const align = mine ? "flex-end" : "flex-start";
        const bubbleStyle = `${commonBubbleStyle} ${mine ? sentStyle : receivedStyle}`;

        chatBox.innerHTML += `
            <div style="display: flex; flex-direction: column; align-items: ${align}; margin-bottom: 0.75rem; width: 100%;">
                <div style="${bubbleStyle}">
                    ${msg.message_text.replace(/</g, "&lt;").replace(/>/g, "&gt;")}
                </div>
                <div style="font-size: 0.65rem; color: #94a3b8; margin-top: 0.25rem;">
                    ${new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                </div>
            </div>
        `;
    });

    chatBox.scrollTop = chatBox.scrollHeight;
}

async function sendMessage() {
    if (!currentRecipientId) {
        alert("Select a user to message");
        return;
    }

    const input = document.getElementById("messageInput");
    const text = input.value;

    if (!text.trim()) return;

    // Optional: Include listingId if this is the first message starting from a listing page
    let payload = {
        sender_id: currentUser1.id,
        recipient_id: currentRecipientId,
        message_text: text
    };
    
    if (currentListingId) {
        payload.listing_id = currentListingId;
    }

    input.value = "";
    input.focus();

    // Optimistically update UI
    const chatBox = document.getElementById("chat-box");
    // Clear the "no messages" placeholder if it exists
    if (chatBox.innerHTML.includes("No messages yet.")) chatBox.innerHTML = "";
    
    const align = "flex-end";
    const bubbleStyle = "padding: 0.75rem 1rem; border-radius: 12px; max-width: 70%; word-break: break-word; background: var(--primary-color, #0f766e); color: white; border-bottom-right-radius: 4px;";
    
    chatBox.innerHTML += `
        <div style="display: flex; flex-direction: column; align-items: ${align}; margin-bottom: 0.75rem; width: 100%; opacity: 0.7;" id="optimistic-msg">
            <div style="${bubbleStyle}">
                ${text.replace(/</g, "&lt;").replace(/>/g, "&gt;")}
            </div>
            <div style="font-size: 0.65rem; color: #94a3b8; margin-top: 0.25rem;">
                Sending...
            </div>
        </div>
    `;
    chatBox.scrollTop = chatBox.scrollHeight;

    const { error } = await supabase1
        .from("messages")
        .insert([payload]);

    if (error) {
        console.error(error);
        alert("Failed to send message: " + error.message);
        // Remove optimistic message on error
        const optMsg = document.getElementById('optimistic-msg');
        if (optMsg) optMsg.remove();
        return;
    }
}

function subscribeToMessages() {
    if (channels) {
        supabase1.removeChannel(channels);
    }
    channels = supabase1
        .channel("messages_channel")
        .on(
            "postgres_changes",
            {
                event: "INSERT",
                schema: "public",
                table: "messages"
            },
            (payload) => {
                const msg = payload.new;
                // If message is related to current conversation, load messages
                if (
                    (msg.sender_id === currentUser1.id && msg.recipient_id === currentRecipientId) ||
                    (msg.sender_id === currentRecipientId && msg.recipient_id === currentUser1.id)
                ) {
                    loadMessages();
                } else {
                    // Update conversation list if it's a new user
                    loadConversations();
                }
            }
        )
        .subscribe();
}

document.getElementById("sendBtn").addEventListener("click", sendMessage);
document.getElementById("messageInput").addEventListener("keypress", (e) => {
    if (e.key === "Enter") sendMessage();
});

document.addEventListener('DOMContentLoaded', init);

</script>
</body>
</html>
